networks:
  api_red:

services:
  eureka-server:
    image: rae-eureka-server
    container_name: rae-eureka-server
    networks:
      - api_red
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper-service:
    image: rae-scraper-service
    container_name: rae-scraper-service
    networks:
      - api_red
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_SERVER=http://rae-eureka-server:8761/
      - SERVICE_PORT=8090
    ports:
      - "8090:8090"

  api-words:
    image: rae-api-words
    container_name: rae-api-words
    networks:
      - api_red
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=${DB_URL}
      - EUREKA_CLIENT_SERVICE=${EUREKA_CLIENT_SERVICE}
      - JWT_KEY=${JWT_KEY}
      - JWT_USER=${JWT_USER}
    ports:
      - "8080:8080"

