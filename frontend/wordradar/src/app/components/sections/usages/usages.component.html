<section class="section-stats-component flex flex-col justify-center w-[90%] md:w-[80%] max-w-[1200px] m-auto py-8">
    <h2 class="text-2xl sm:text-3xl md:text-5xl mt-2 font-bold">¿Para qué puedes usar Wordradar?</h2>

    <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-4 mt-8">
        <app-usage
        *ngFor="let usage of usages"
        [iconPath]="usage.image"
        [title]="usage.title"
        [description]="usage.description"> </app-usage>
    </div>
</section>
