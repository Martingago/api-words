<div class="grid grid-cols-[auto_1fr_auto] sm:grid-cols-[auto_1fr_auto_auto]">

    <p type="text" class="p-2 text-xs sm:text-base bg-gray-400 border border-gray-400 text-white rounded-tl rounded-bl">
        {{endpoint}}
    </p>

    <!-- Input para el parámetro -->
    <input type="text" [(ngModel)]="param" class="w-full text-xs sm:text-base p-2 bg-gray-50 border-t border-b border-gray-400"
        placeholder="search/piedra" />


    <!-- Botón copiar path -->
    <button (click)="copyToClipboard()" class="w-auto cursor-pointer bg-gray-200 hover:bg-gray-400 px-4 transition-all border border-gray-400">
        <img class="h-[18px] sm:h-[24px]" src="/assets/icons/global/copy-icon.svg" alt="Icon copy to clipboard">
    </button>

    <!-- Botón de ejecutar -->
    <button (click)="tryRequest()" class="w-auto col-span-full sm:col-auto 
    rounded sm:rounded-none sm:rounded-tr sm:rounded-br py-2 sm:py-none mt-2 sm:mt-0 cursor-pointer bg-primary hover:bg-primary-dark text-white px-4 ">
        Probar
    </button>
</div>

<div class="p-4 rounded-lg mx-auto">
    <!-- Spinner de carga -->
    <div *ngIf="loading" class="text-center my-2">⏳ Cargando...</div>

    <!-- Mostrar error -->
    <div *ngIf="error" class="text-red-400 mt-2">{{ error }}</div>

    <!-- Mostrar respuesta -->
    <div *ngIf="responseData" class="bg-gray-800 p-2 rounded mt-4 relative">
        <pre class="whitespace-pre-wrap text-xs">{{ responseData | json }}</pre>

        <!-- Botón copiar -->
        <button (click)="copyToClipboard()"
            class="absolute top-2 right-2 bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-xs">
            📋 Copiar
        </button>
    </div>
</div>
