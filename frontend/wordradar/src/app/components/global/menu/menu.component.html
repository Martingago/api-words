<div class="bg-primary">
    <div class="md:w-[80%] max-w-[1200px] m-auto text-white">
        <mat-toolbar>
            <!-- Logotipo -->
            <span class="logo">WordRadar</span>
            <!-- Menú de hamburguesa (solo visible en móviles) -->
            <button mat-icon-button (click)="toggleMenu()" class="menu-button">
              <mat-icon>menu</mat-icon>
            </button>
            <!-- Enlaces (visibles en escritorio) -->
            <div class="links" [ngClass]="{'hidden': !menuOpen && isMobile, 'md:block': true}">
              <a mat-button routerLink="/inicio">Inicio</a>
              <a mat-button routerLink="/servicios">Servicios</a>
              <a mat-button routerLink="/acerca-de">Acerca de</a>
              <a mat-button routerLink="/contacto">Contacto</a>
            </div>
        </mat-toolbar>
      </div>
</div>
