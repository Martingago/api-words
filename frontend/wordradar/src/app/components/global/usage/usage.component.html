<article class="h-full bg-light-dark px-3 py-6 md:px-4 rounded shadow md:shadow-xl lg:max-w-[260px]">
    <img [src]="iconPath" alt="Icon section {{title}}" class="h-[48px] mx-auto my-2">
    <h3 class="text-xl sm:text-xl text-primary text-center font-bold">{{title}}</h3>
    <p class="mt-3 text-center">{{description}}</p>
</article>
