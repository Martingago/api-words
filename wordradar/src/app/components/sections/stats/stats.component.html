<section class="section-stats-component flex flex-col justify-center w-[90%] md:w-[80%] max-w-[1200px] m-auto">
    <div class="flex flex-col">
        <div>
            <app-h2>{{title}}</app-h2>
            <p class="sm:text-xl">{{paragraph}}</p>
        </div>
        <div class="grid my-5 lg:grid-cols-4 sm:grid-cols-2 lg:gap-6 gap-4">
        <app-web-stat *ngFor="let stat of stats" [atribute]="stat.atribute" [count]="stat.animatedString"></app-web-stat>

        </div>
    </div>
</section>
