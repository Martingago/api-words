<section class="flex flex-col justify-center w-[90%] md:w-[80%] max-w-[1200px] m-auto py-8">
    <app-h2>{{usagesTitle}}</app-h2>

    <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-3 md:gap-5 lg:gap-8">
        <app-usage
        *ngFor="let usage of usages"
        [iconPath]="usage.image"
        [title]="usage.title"
        [description]="usage.description"> </app-usage>
    </div>
</section>
