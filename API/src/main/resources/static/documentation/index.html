<!DOCTYPE html>
<html>
<head>
    <title>Documentación WordRadar</title>
    <!-- needed for adaptive design -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="documentation/wordradar_logo.png">
    <style>
        body {
          margin: 0;
          padding: 0;
        }
    </style>
</head>
<body>
<!-- Personalización del tema de redoc -->
<redoc
        hide-host-in-topbar="true"
        sort-tags-alphabetically="true"
        x-logo="static/documentation/lose-icon.png"
        spec-url='http://localhost:8080/v3/api-docs'
        theme='{
         "sidebar": {
           "backgroundColor": "#F3F3F3"
         },
         "typography": {
            "fontSize": "16px",
            "code": {
                "fontSize": "16px"
            }
         },
         "rightPanel": {
            "backgroundColor": "#777676"
         }

       }'


>

</redoc>
<script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"> </script>
</body>
</html>
